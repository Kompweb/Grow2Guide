name: Deploy subscribe Worker

# Runs the Worker tests, then deploys workers/subscribe (Self-Assessment results email) to
# Cloudflare and sets its secret. Newsletter signups moved to Substack, so the Resend Audience
# and Google Sheets backup secrets are no longer used.
# Repository secrets (Settings → Secrets and variables → Actions):
#   required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, RESEND_API_KEY
# Manual only: GitHub Actions is not available on this account's plan, so automatic runs on
# push always failed. The Worker is published with `npx wrangler deploy` (see workers/subscribe/README.md)
# or by Cloudflare Workers Builds connected to this repo.
on:
  workflow_dispatch:

concurrency:
  group: deploy-subscribe-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/subscribe
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Check required secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RESEND_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Deploy
        run: npx -y wrangler@4 deploy

      - name: Set Resend secret
        run: |
          printf '%s' "$RESEND_API_KEY" | npx -y wrangler@4 secret put RESEND_API_KEY
