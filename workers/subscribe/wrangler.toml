name = "g2g-subscribe"
main = "index.js"
compatibility_date = "2026-09-01"

# grow2guide.com's DNS is on Wix (ns2/ns3.wixdns.net), not Cloudflare, so a custom domain
# route here cannot resolve — confirmed live on 2026-10-01 (subscribe.grow2guide.com did not
# resolve after deploying with the route below). Using the workers.dev URL instead; see README.md.
# routes = [{ pattern = "subscribe.grow2guide.com", custom_domain = true }]
workers_dev = true

# Sender for the Self-Assessment results email. Must be on a domain verified in Resend.
# (Newsletter signups moved to Substack; this Worker no longer adds anyone to a list.)
[vars]
WELCOME_FROM = "Grow2Guide <hello@grow2guide.com>"
# Where replies to the results email go. Gmail cannot be the sender (Resend only sends from a
# verified domain), but it can receive replies.
REPLY_TO = "grow2guide@gmail.com"

# Keep Worker logs in the Cloudflare dashboard.
[observability]
enabled = true

# At most 5 requests per minute per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
