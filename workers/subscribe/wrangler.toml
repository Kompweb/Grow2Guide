name = "g2g-subscribe"
main = "index.js"
compatibility_date = "2026-09-01"

# grow2guide.com's DNS is on Wix (ns2/ns3.wixdns.net), not Cloudflare, so a custom domain
# route here cannot resolve — confirmed live on 2026-10-01 (subscribe.grow2guide.com did not
# resolve after deploying with the route below). Using the workers.dev URL instead; see README.md.
# routes = [{ pattern = "subscribe.grow2guide.com", custom_domain = true }]
workers_dev = true

# Keep Worker logs (the consent records written on each signup) in the Cloudflare dashboard.
[observability]
enabled = true

# At most 5 signups per minute per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
